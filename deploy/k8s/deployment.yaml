apiVersion: apps/v1
kind: Deployment
metadata:
  name: span-home
  labels:
    app.kubernetes.io/name: span-home
spec:
  # One, always. Two of these would both bind the HomeKit port, both advertise the same
  # bridge over mDNS, both write the same state files, and both open MQTT sessions to the
  # same panels. There is nothing to gain from a second.
  replicas: 1

  # Recreate, not RollingUpdate. A rolling update would start the new pod before the old
  # one exits, and it would fail to bind the HomeKit port on the host network and sit in
  # CrashLoopBackOff while the old pod kept serving. Recreate accepts a few seconds of
  # downtime instead.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: span-home

  template:
    metadata:
      labels:
        app.kubernetes.io/name: span-home
      annotations:
        # Restarts the pod when the config Secret changes, which it otherwise would not
        # notice: the file is read once at startup. Edit this, or just
        # `kubectl rollout restart`.
        config-reload: "edit-me-to-force-a-restart"
    spec:
      # THE reason this manifest looks the way it does.
      #
      # HomeKit discovery and resolution are mDNS: multicast to 224.0.0.251:5353 on the
      # local link. A pod on the cluster's overlay network cannot send or receive that, so
      # the Home app would never find the bridge, and a bridge that was already paired
      # would stop resolving and show every circuit as "No Response".
      #
      # This bridge needs the LAN for a second reason the others do not: it speaks MQTT
      # directly to the SPAN panels on your network.
      #
      # hostNetwork puts the pod on the node's own LAN interface, which is the only way
      # either of those works short of a macvlan/ipvlan CNI. The costs: the container's
      # ports are the node's ports (nothing else on that node may use 8089 or 51828), and
      # the pod can reach anything the node can.
      hostNetwork: true

      # Without this, a hostNetwork pod inherits the node's resolv.conf and loses cluster
      # DNS - so it could not resolve, say, an in-cluster Prometheus by service name.
      dnsPolicy: ClusterFirstWithHostNet

      # The node must sit on the same LAN/VLAN as your Apple TV, your HomePod and your
      # panels; mDNS does not cross subnets. Pin it:
      #   kubectl label node <node-name> homekit=true
      nodeSelector:
        homekit: "true"

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # So the mounted volume is writable by the non-root user.
        fsGroup: 10001

      terminationGracePeriodSeconds: 30

      # Packages published to ghcr.io are PRIVATE by default, and a private package gives
      # ImagePullBackOff with "denied". Either make the package public once (Packages ->
      # the package -> Package settings -> Change visibility), or create a pull secret and
      # uncomment this. See deploy/k8s/README.md.
      # imagePullSecrets:
      #   - name: ghcr-pull

      # The bridge resolves every file it writes - pairing state, the panel credentials it
      # earns at registration, accessory IDs, the layout number - relative to the directory
      # holding its config file. One of those four has no override setting at all, so
      # pointing each at /data individually is not possible; the config file has to live in
      # /data with them. A Secret mount is read-only, so the config is copied in here
      # instead, fresh on every start so an edited Secret takes effect on restart.
      initContainers:
        - name: install-config
          image: ghcr.io/chelin1974/span-home:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            # The config is refreshed on every start, so editing the Secret and restarting
            # takes effect. The panel credentials are only seeded if the volume has none:
            # registration is a one-off interactive step (door presses, or the app
            # passphrase) that cannot be done from inside a pod, so you register once
            # outside the cluster and load the result here - but once the bridge owns that
            # file, it must not be overwritten from a stale Secret.
            - |
              set -e
              cp -f /config/span-home.config.json /data/span-home.config.json
              if [ -f /config/span-home.credentials.json ] && [ ! -f /data/span-home.credentials.json ]; then
                cp /config/span-home.credentials.json /data/span-home.credentials.json
                echo "seeded span-home.credentials.json from the Secret"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: state
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      containers:
        - name: span-home
          image: ghcr.io/chelin1974/span-home:latest
          imagePullPolicy: IfNotPresent

          # Reads the copy the init container placed on the volume, so the files it writes
          # land beside it rather than on the container's ephemeral filesystem.
          args: ["--config", "/data/span-home.config.json"]

          ports:
            - name: dashboard
              containerPort: 8089
              protocol: TCP
            - name: homekit
              containerPort: 51828
              protocol: TCP

          volumeMounts:
            - name: state
              mountPath: /data
            # readOnlyRootFilesystem is on and the JVM wants a temp dir.
            - name: tmp
              mountPath: /tmp

          # /healthz turns 503 once the mDNS responder has died, which is the one failure a
          # liveness probe on this bridge actually needs to catch: the dashboard keeps
          # serving perfectly while nothing in Apple Home can reach the bridge, and JmDNS
          # never recovers on its own. Probing the dashboard page instead would pass
          # forever through exactly that fault.
          startupProbe:
            httpGet:
              path: /healthz
              port: dashboard
            # Connecting to every panel before the dashboard starts makes first boot
            # slower than a restart. 36 x 5s = 180s before giving up.
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /healthz
              port: dashboard
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /api/state
              port: dashboard
            periodSeconds: 10
            timeoutSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # No CPU limit on purpose: CFS throttling adds latency to the mDNS responder
              # and HomeKit is sensitive to a slow reply. Memory is capped; the image sets
              # -XX:MaxRAMPercentage=70, so the heap follows this number.
              memory: 768Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: config
          secret:
            secretName: span-home-config
            # No `items` filter on purpose: the Secret may hold just the config, or the
            # config and the panel credentials. Naming a key that is absent makes the
            # mount fail, so every key the Secret has is projected and the init container
            # decides what to do with each.
        - name: state
          persistentVolumeClaim:
            claimName: span-home-state
        - name: tmp
          emptyDir: {}
