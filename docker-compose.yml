# SpanHome's own stack: the bridge, Prometheus and Grafana.
#
#   docker compose up -d                      # Prometheus only, as before
#   docker compose --profile grafana up -d    # Prometheus and Grafana
#   docker compose --profile bridge up -d     # also run the bridge in a container
#   docker compose run --rm build             # build the jars, no local Maven needed
#
# The bridge is behind a profile rather than on by default, on purpose: if you already run
# it under systemd or launchd on this machine, starting a second copy would fight over
# HomeKit port 51828 and the state files. `docker compose up -d` therefore still means
# "Prometheus only", exactly as it did before.
#
# On Docker Desktop for Mac or Windows the bridge cannot work in a container at all: host
# networking there does not give you the real LAN, so Bonjour never reaches your phone and
# the panels are unreachable. Run the bridge outside Docker on those, and use this file for
# Prometheus and Grafana only.
#
# This stack shares nothing with the DaikinHome or CellGateHome bridges - separate config and
# separate volumes - so any one of them runs with or without the others:
#
#   SpanHome      Prometheus 9090   Grafana 3000
#   DaikinHome    Prometheus 9090   Grafana 3000
#   CellGateHome  Prometheus 9092   Grafana 3002
#
# DaikinHome's stack serves the same ports as this one, so run only one of the two and point
# both bridges at it. CellGateHome's has its own and can run alongside either.
name: span-home

services:
  span-home:
    build: .
    image: ghcr.io/chelin1974/span-home:latest
    profiles: ["bridge"]
    container_name: span-home
    restart: unless-stopped

    # Required, not optional. HomeKit discovery is mDNS multicast on the local link, and
    # this bridge also speaks MQTT to the panels on your network - a container on Docker's
    # bridge network can do neither. Host networking also means the dashboard is on the
    # host's own port 8089, so there is no `ports:` mapping here.
    network_mode: host

    environment:
      # The Spring Boot flavour reads the same span-home.config.json the CLI reads; this points
      # it at the copy on the mounted data directory rather than one beside the jar.
      SPAN_CONFIG_FILE: /data/span-home.config.json
      # Every file the bridge writes goes here, on the mount below. The config already sits in
      # /data so this is where they would land anyway - set explicitly so it is a declared fact
      # rather than a consequence of where the config happens to be.
      SPAN_DATA_DIRECTORY: /data

    volumes:
      # Everything the bridge writes - pairing state, the panel credentials earned at
      # registration, accessory IDs, the layout number - is resolved relative to the
      # config file, so the config lives in the data directory with them.
      #
      # Put span-home.config.json in ./data before starting, and register with the panels
      # first so ./data/span-home.credentials.json exists:
      #     java -jar cli/target/span-home.jar --config ./data/span-home.config.json --register
      - ./data:/data

    # Tomcat refuses to start without a writable temp dir, and on the container's writable
    # layer that is a disk write - so a full Docker disk stops the bridge booting at all, with
    # a stack trace that points at Tomcat rather than at the disk. In RAM it cannot be filled
    # by anything else, and nothing here needs to survive a restart: the pairing state is on
    # the data mount above.
    tmpfs:
      - /tmp:size=64m

    healthcheck:
      # /healthz turns 503 once the mDNS responder has died, which is the failure that
      # matters here: the dashboard keeps serving perfectly while nothing in Apple Home can
      # reach the bridge.
      #
      # "CMD" with bash spelled out, not "CMD-SHELL": CMD-SHELL runs /bin/sh, which in the
      # eclipse-temurin base is dash, and /dev/tcp is a bash feature. Under dash this failed
      # with "cannot create /dev/tcp/...: Directory nonexistent" on every interval, so the
      # container sat permanently "unhealthy" however well the bridge was running. The image
      # carries no curl, wget or nc, so bash's own socket is the only probe available.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8089 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 4

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=400d
      - --web.enable-otlp-receiver
    ports:
      # Only this machine: the bridge pushes here and the dashboard reads through the bridge.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["grafana"]
    depends_on: [prometheus]
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/span-home.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  # Builds the jars with Maven and a JDK from the image; the Maven cache lives in a volume.
  # Leaves cli/target/span-home.jar (what launchd and systemd run) and
  # web/target/span-home-web.jar (what the container above runs) behind.
  #
  # The JDK has to match the Dockerfile's build stage: the project compiles with
  # maven.compiler.release=27, which a JDK 21 image refuses outright.
  build:
    image: maven:3.10-eclipse-temurin-27
    profiles: ["build"]
    working_dir: /src
    command: mvn -q -B package
    volumes:
      - .:/src
      - maven-cache:/root/.m2

volumes:
  maven-cache:
  prometheus-data:
  grafana-data:
